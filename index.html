
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - R9chhood Studios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFFFF4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .contact-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #25D366; /* WhatsApp Green */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h2>Contact R9chhood Studios</h2>
        <form id="whatsappForm">
            <div class="form-group">
                <label for="name">Aapka Naam</label>
                <input type="text" id="name" placeholder="Apna naam likhein" required>
            </div>

            <div class="form-group">
                <label for="email">Aapka Email</label>
                <input type="email" id="email" placeholder="Apna email likhein" required>
            </div>

            <div class="form-group">
                <label for="message">Aapka Message</label>
                <textarea id="message" placeholder="Apna message yahan likhein..." required></textarea>
            </div>

            <button type="submit">WhatsApp Par Bhejein 🚀</button>
        </form>
    </div>

    <script>
        document.getElementById('whatsappForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Form inputs ki values lena
            let name = document.getElementById('name').value;
            let email = document.getElementById('email').value;
            let message = document.getElementById('message').value;

            // ⚠️ Yahan apna WhatsApp number likhein (Country code ke saath, Bina '+' ya spaces ke)
            // Jaise agar India ka number hai toh: 919876543210
            let phoneNumber = "9178229167"; 

            // WhatsApp Message Format tayyar karna
            let text = `*New Form Submission - R9chhood Studios*%0A%0A` +
                       `*Name:* ${encodeURIComponent(name)}%0A` +
                       `*Email:* ${encodeURIComponent(email)}%0A` +
                       `*Message:* ${encodeURIComponent(message)}`;

            // WhatsApp URL par redirect karna
            let whatsappURL = `https://wa.me/${phoneNumber}?text=${text}`;
            window.open(whatsappURL, '_blank');
        });
    </script>

</body>
</html>
